<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light" />
		<meta name="theme-color" content="#e9ebee" />

		<!--
			D: a folha do Carretel é uma só, `src/app.css`, importada pelo layout.
			As duas fontes do produto são auto-hospedadas em `static/fontes`
			(Manrope para ler, Unbounded para números e títulos; SIL OFL 1.1) e
			pré-carregadas para a primeira tela não trocar de letra depois de
			pintada.
		-->
		<link
			rel="preload"
			href="%sveltekit.assets%/fontes/manrope-latin-wght.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fontes/unbounded-latin-wght.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
